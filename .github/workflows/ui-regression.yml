name: UI regression checks

on:
  pull_request:
    paths:
      - 'src/ui/**'
      - 'src/runtime/**'
      - 'src/engine/**'
      - 'src/content/**'
      - 'src/persistence/**'
      - 'scripts/browser-*.mjs'
      - 'tools/**'
      - 'tests/browser/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
      - name: Install browser runner without changing lockfile
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: npm run test:browser
      - name: Upload UI screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-regression
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
